  </main>
  <script>
  /* Load CONTENT fresh each visit (beats GitHub Pages' ~10-min cache so new edits
     show right away); code files load right after and may stay cached. */
  (function () {
    function add(src, then) {
      var s = document.createElement('script');
      s.src = src; if (then) { s.onload = s.onerror = then; }
      document.body.appendChild(s);
    }
    add('assets/js/data.js?v=' + Date.now(), function () {
      add('assets/js/ui.js'); add('assets/js/artwork.js');
    });
  })();
  </script>
