<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ann — Gallery</title>
  <meta name="description" content="Artwork by Ann Wong — characters, portraits, nature &amp; places, and zentangles.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="gallery">
  <header id="sidebar" class="topbar"></header>
  <main class="main">
    <nav class="filters" id="filters" aria-label="Categories"></nav>
    <div class="grid" id="grid"></div>
  </main>
  <script>
  /* Load gallery CONTENT fresh on every visit. GitHub Pages caches files for ~10 min
     (max-age=600), which would otherwise delay a newly published photo from showing
     across browsers/devices/CDN edges. A per-load ?v= on data.js sidesteps that cache;
     the code files (ui/gallery) load right after and may stay cached (they change rarely). */
  (function () {
    function add(src, then) {
      var s = document.createElement('script');
      s.src = src; if (then) { s.onload = s.onerror = then; }
      document.body.appendChild(s);
    }
    add('assets/js/data.js?v=' + Date.now(), function () {
      add('assets/js/ui.js');
      /* The landing tab is "All" (gallery.js). A ?cat= link — how the nav row on
         the About / artwork pages points back here — opens that gallery instead,
         by clicking its filter button once gallery.js has built the bar. (Doing
         it here keeps gallery.js byte-identical with Josie's copy.) */
      add('assets/js/gallery.js', function () {
        var want = new URLSearchParams(location.search).get('cat');
        if (!want) return;
        var btns = document.querySelectorAll('#filters .filter');
        for (var i = 0; i < btns.length; i++) {
          if (btns[i].textContent === want) { btns[i].click(); return; }
        }
      });
    });
  })();
  </script>
</body>
</html>
